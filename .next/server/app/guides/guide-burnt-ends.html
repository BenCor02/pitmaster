es avec cheddar fondu\n\n*Utilise le [calculateur](/) sur Brisket pour la première phase de cuisson.*"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"prefetchedGuide\":{\"id\":\"50ccbf9f-9988-4aca-8475-13694626efda\",\"title\":\"Les burnt ends : les bonbons du pitmaster\",\"slug\":\"guide-burnt-ends\",\"summary\":\"Des cubes de viande caramélisés au fumoir. Le snack BBQ le plus addictif qui existe.\",\"content\":\"$13\",\"cover_url\":\"https://images.pexels.com/photos/8753690/pexels-photo-8753690.jpeg?auto=compress\u0026cs=tinysrgb\u0026w=800\u0026h=400\u0026fit=crop\",\"category\":\"technique\",\"tags\":[\"burnt-ends\",\"poitrine\",\"boeuf\",\"porc\",\"caramelise\",\"snack\"],\"meat_type\":\"brisket\",\"seo_title\":\"Burnt ends au fumoir (bœuf et porc) — Charbon \u0026 Flamme\",\"seo_description\":\"Comment faire des burnt ends : cubes caramélisés de poitrine de bœuf ou de porc au fumoir.\",\"sort_order\":9,\"status\":\"published\",\"created_at\":\"2026-03-31T21:22:46.80787+00:00\",\"updated_at\":\"2026-03-31T21:22:46.80787+00:00\"},\"slug\":\"guide-burnt-ends\"}]\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Burnt ends au fumoir (bœuf et porc) — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Comment faire des burnt ends : cubes caramélisés de poitrine de bœuf ou de porc au fumoir.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Burnt ends au fumoir (bœuf et porc) — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Comment faire des burnt ends : cubes caramélisés de poitrine de bœuf ou de porc au fumoir.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:site_name\",\"content\":\"Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:locale\",\"content\":\"fr_FR\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:type\",\"content\":\"website\"
