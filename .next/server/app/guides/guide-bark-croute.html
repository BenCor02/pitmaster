bark se former. Après, un spray léger (vinaigre de cidre) aide à fixer la fumée.\n\n**6. Wrap au bon moment.** Trop tôt : bark molle. Le bon moment : quand elle est sombre et sèche au toucher (68-74°C interne). Papier boucher \u003e alu.\n\n### Problèmes courants\n\n- **Bark molle** : wrap trop tôt, trop de spray, fumoir trop humide\n- **Bark brûlée** : température trop haute, trop de sucre dans le rub\n- **Pas de bark** : pas assez de rub, pas assez de temps"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"prefetchedGuide\":{\"id\":\"293410f2-8590-4674-9d87-b128ac946855\",\"title\":\"La bark : comment obtenir une croûte parfaite\",\"slug\":\"guide-bark-croute\",\"summary\":\"La bark est la croûte sombre et savoureuse qui se forme au fumoir. Voici comment l'obtenir parfaite.\",\"content\":\"$13\",\"cover_url\":\"https://images.pexels.com/photos/5836779/pexels-photo-5836779.jpeg?auto=compress\u0026cs=tinysrgb\u0026w=800\u0026h=400\u0026fit=crop\",\"category\":\"technique\",\"tags\":[\"bark\",\"croute\",\"rub\",\"maillard\",\"caramelisation\",\"fumee\"],\"meat_type\":null,\"seo_title\":\"La bark au fumoir : obtenir une croûte parfaite — Charbon \u0026 Flamme\",\"seo_description\":\"Comment obtenir une bark parfaite au fumoir : rub, température, flux d'air, timing du wrap.\",\"sort_order\":12,\"status\":\"published\",\"created_at\":\"2026-03-31T21:22:46.80787+00:00\",\"updated_at\":\"2026-03-31T21:22:46.80787+00:00\"},\"slug\":\"guide-bark-croute\"}]\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"La bark au fumoir : obtenir une croûte parfaite — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Comment obtenir une bark parfaite au fumoir : rub, température, flux d'air, timing du wrap.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"La bark au fumoir : obtenir une croûte parfaite — Charbon \u0026 Flamme | Charbon \u0026
