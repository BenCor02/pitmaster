teux\n- **Agneau de lait des Pyrénées** : très jeune, à fumer très doucement à 100°C\n\n### Assaisonnement\n\nL'agneau appelle les herbes méditerranéennes :\n- **Classique** : herbes de Provence + sel + poivre + ail\n- **Oriental** : cumin + coriandre + sumac + za'atar\n- **Tandoori** : yaourt + curcuma + garam masala (marinade 12h)\n\n### Le bois pour l'agneau\n\n- **Cerisier** : doux, fruité — le meilleur choix\n- **Vigne** : sarments secs, goût méditerranéen\n- **Olivier** : complexe, herbacé. Le luxe absolu.\n- Évite le hickory et le mesquite — trop forts pour l'agneau.\n\n*Utilise le [calculateur](/) pour estimer le temps selon la pièce.*"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"prefetchedGuide\":{\"id\":\"3dcedb09-9301-4280-8005-3fadec958aa6\",\"title\":\"L'agneau au fumoir : épaule, souris, gigot\",\"slug\":\"guide-agneau-fumoir\",\"summary\":\"L'agneau est le grand oublié du BBQ. L'épaule fumée donne un effiloché spectaculaire.\",\"content\":\"$13\",\"cover_url\":\"https://images.pexels.com/photos/3535383/pexels-photo-3535383.jpeg?auto=compress\u0026cs=tinysrgb\u0026w=800\u0026h=400\u0026fit=crop\",\"category\":\"viande\",\"tags\":[\"agneau\",\"epaule\",\"souris\",\"gigot\",\"collier\",\"pulled-lamb\",\"fumoir\"],\"meat_type\":\"lamb_shoulder\",\"seo_title\":\"Agneau au fumoir (épaule, souris, gigot) — Charbon \u0026 Flamme\",\"seo_description\":\"Comment réussir l'agneau au fumoir : épaule, souris, gigot, collier. Quel agneau français choisir, quel bois.\",\"sort_order\":8,\"status\":\"published\",\"created_at\":\"2026-03-31T21:22:46.80787+00:00\",\"updated_at\":\"2026-03-31T21:22:46.80787+00:00\"},\"slug\":\"guide-agneau-fumoir\"}]\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Agneau au fumoir (épaule, souris, gigot) — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Comment réussir l'agneau au fumoir : épaule, sou
