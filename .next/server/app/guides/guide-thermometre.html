 afficher 0°C\n- **Eau bouillante** : doit afficher 100°C"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"prefetchedGuide\":{\"id\":\"05212b94-f15f-4b00-956c-2d5fc2341c0c\",\"title\":\"Le thermomètre : l'outil indispensable\",\"slug\":\"guide-thermometre\",\"summary\":\"Sans thermomètre précis, tu cuisines à l'aveugle. Voici lesquels choisir.\",\"content\":\"$13\",\"cover_url\":\"https://images.pexels.com/photos/792027/pexels-photo-792027.jpeg?auto=compress\u0026cs=tinysrgb\u0026w=800\u0026h=400\u0026fit=crop\",\"category\":\"equipement\",\"tags\":[\"thermometre\",\"sonde\",\"temperature\",\"thermoworks\",\"thermopro\"],\"meat_type\":null,\"seo_title\":\"Guide thermomètre barbecue — Charbon \u0026 Flamme\",\"seo_description\":\"Quel thermomètre BBQ choisir, où placer la sonde, comment faire le test de tendreté.\",\"sort_order\":18,\"status\":\"published\",\"created_at\":\"2026-03-31T21:22:46.80787+00:00\",\"updated_at\":\"2026-03-31T21:22:46.80787+00:00\"},\"slug\":\"guide-thermometre\"}]\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Guide thermomètre barbecue — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Quel thermomètre BBQ choisir, où placer la sonde, comment faire le test de tendreté.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Guide thermomètre barbecue — Charbon \u0026 Flamme | Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Quel thermomètre BBQ choisir, où placer la sonde, comment faire le test de tendreté.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:site_name\",\"content\":\"Charbon \u0026 Flamme\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:locale\",\"content\":\"fr_FR\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"7\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"8\",{\"name\
